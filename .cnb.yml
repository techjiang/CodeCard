main:
  push:
    - docker:
        image: node:22
      stages:
        - name: install
          script: npm ci
        - name: check
          script: npm run typecheck && npm run test && npm run build
          artifacts:
            - dist

$:
  pull_request:
    - docker:
        image: node:22
      stages:
        - name: install
          script: npm ci
        - name: check
          script: npm run typecheck && npm run test && npm run build
