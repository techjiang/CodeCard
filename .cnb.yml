main:
  push:
    - docker:
        image: node:22
      stages:
        - name: install
          script: npm ci
        - name: check
          script: npm run typecheck && npm run test && npm run build
          artifacts:
            - dist
        - name: e2e
          script: npx playwright install --with-deps chromium && npm run test:e2e

$:
  pull_request:
    - docker:
        image: node:22
      stages:
        - name: install
          script: npm ci
        - name: check
          script: npm run typecheck && npm run test && npm run build
        - name: e2e
          script: npx playwright install --with-deps chromium && npm run test:e2e
